# Convert Docker Hub tags to Singularity SIFs and attach them to the
# rolling `sif-images` GitHub release, plus optionally build one native
# SIF from the tarballs (full recompile, needs root). GitHub publishes
# release assets only; the separate GitLab `sif-build` job pushes SIFs
# to the GitLab container registry.
#
# Manual dispatch converts the given tags (default: latest + latest-piic);
# the weekly schedule rebuilds a tag only when its Hub push is newer than
# the published asset (fail-open: any check failure rebuilds). Missing Hub
# tags are skipped with a warning instead of failing the job.
#
# Set the `natif` input to build a native SIF instead (newest release by
# default; native builds always use the Alpine recipe; `release` pins one
# explicitly). Native assets accumulate per release name on the same
# rolling release.
# The Friday schedule also runs the native build, but only when its
# asset is still missing (upstream tarballs are immutable).
#
# Uses the distribution singularity-container package (4.x on Ubuntu
# 24.04), installed with plain apt-get in both jobs — no third-party
# actions, no version pinning to maintain.

name: publish-sifs

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Hub tags to convert (space-separated, ignored with natif)"
        required: false
        default: "latest latest-piic"
      natif:
        description: "Build a native SIF from tarballs instead of converting"
        required: false
        default: false
        type: boolean
      release:
        description: "GILDAS release for the native build (empty = newest)"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 5"

permissions:
  contents: write

jobs:
  sif:
    if: github.event_name != 'workflow_dispatch' || inputs.natif != true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Install Singularity
        run: sudo apt-get update -qq && sudo apt-get install -y -qq singularity-container squashfs-tools uidmap
      - name: Build SIFs and upload to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAGS="${{ inputs.tags }}"
          [ -z "$TAGS" ] && TAGS="latest latest-piic"
          gh release view sif-images >/dev/null 2>&1 || \
            gh release create sif-images --title "Singularity images (rolling)" \
              --notes "SIF images converted from Docker Hub tags. Rebuilt when the tags move."
          for tag in $TAGS; do
            sif="gildas-$tag.sif"
            if ! curl -s -o /dev/null -f "https://hub.docker.com/v2/repositories/abeelen/gildas/tags/$tag"; then
              echo "Tag $tag missing on Hub, skipping."
              continue
            fi
            if [ "${{ github.event_name }}" = "schedule" ]; then
              pushed=$(curl -s "https://hub.docker.com/v2/repositories/abeelen/gildas/tags/$tag" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_last_pushed',''))" 2>/dev/null || true)
              updated=$(gh api "repos/{owner}/{repo}/releases/tags/sif-images" --jq ".assets[] | select(.name==\"$sif\") | .updated_at" 2>/dev/null || true)
              if [ -n "$pushed" ] && [ -n "$updated" ] && [ "$updated" \> "$pushed" ]; then
                echo "$tag unchanged since $updated, skipping."
                continue
              fi
            fi
            rm -f "$sif"
            # Definition bootstrap (not a bare docker:// conversion) so the
            # SIF carries runscript + %apprun entries. Built as root via
            # sudo: the hosted runners forbid unprivileged mount
            # namespaces, so --fakeroot cannot work there.
            sed "s|^From: .*|From: abeelen/gildas:$tag|" apptainer/gildas-docker.def > /tmp/sif-build.def
            sudo -E singularity build "$sif" /tmp/sif-build.def
            gh release upload sif-images "$sif" --clobber
            sudo rm -f "$sif"
          done

  natif:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.natif == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install Singularity
        run: sudo apt-get update -qq && sudo apt-get install -y -qq singularity-container squashfs-tools
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install click requests beautifulsoup4
      - name: Resolve release and definition file
        id: sel
        env:
          NATIV_RELEASE: ${{ inputs.release }}
        run: |
          SEL=$(python3 -c "
          import os
          from gildas_release import get_natif_commands, _release_sort_key, _load_release_sets
          sets = _load_release_sets()
          cmds = get_natif_commands(sets=sets, dockerfile='docker/Dockerfile.alpine')
          rel = os.environ.get('NATIV_RELEASE', '').strip()
          pick = next((c for c in cmds if c.release == rel), None) if rel else None
          if rel and pick is None:
              sets = _load_release_sets(include_archive=True)
              cmds = get_natif_commands(sets=sets, dockerfile='docker/Dockerfile.alpine')
              pick = next((c for c in cmds if c.release == rel), None)
          if rel and pick is None:
              raise SystemExit(f\"release '{rel}' not buildable natively\")
          pick = pick or sorted(cmds, key=lambda c: _release_sort_key(c.release))[-1]
          print(pick.command)
          ")
          # Heredoc form: safe even if $SEL ever spans several lines.
          {
            echo "command<<SEL_EOF"
            echo "$SEL"
            echo "SEL_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build native SIF (needs root) and upload to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env and expanded as "$SEL_COMMAND" below: inlining
          # step outputs into quoted shell text breaks (and is unsafe)
          # whenever the value contains quotes or parens.
          SEL_COMMAND: ${{ steps.sel.outputs.command }}
        run: |
          sif=$(printf '%s\n' "$SEL_COMMAND" | grep -oE 'gildas-[^ ]+\.sif')
          if [ -z "$sif" ]; then
            echo "::error title=SIF name not resolved::no 'gildas-*.sif' in the build command:" >&2
            printf '%s\n' "$SEL_COMMAND" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if gh release view sif-images --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$sif"; then
              echo "$sif already published, skipping."
              exit 0
            fi
          fi
          echo "Running: $SEL_COMMAND"
          sudo -E bash -c "$SEL_COMMAND"
          gh release view sif-images >/dev/null 2>&1 || \
            gh release create sif-images --title "Singularity images (rolling)" \
              --notes "SIF images converted from Docker Hub tags. Rebuilt when the tags move."
          gh release upload sif-images "$sif" --clobber
          rm -f "$sif"
