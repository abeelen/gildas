# Build and push abeelen/gildas images (Alpine by default, Debian on demand).
#
# The brains stay in gildas_release.py: CI only selects the mode and runs
# what the script prints. Needs two repo secrets for pushes:
#   DOCKERHUB_USERNAME : Docker Hub login
#   DOCKERHUB_TOKEN    : Hub access token with Read & Write permissions
# Pull requests only get a printed plan (no login, no push, no build).

name: build-images

on:
  schedule:
    # Weekly: pick up new upstream GILDAS/PIIC releases.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      release:
        description: "Single GILDAS release (e.g. oct26a, empty = all missing)"
        required: false
        default: ""
      debian:
        description: "Build Debian images (default is Alpine)"
        required: false
        default: false
        type: boolean
      piic:
        description: "Only PIIC images"
        required: false
        default: false
        type: boolean
      archive:
        description: "Include archived releases"
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - Dockerfile
      - Dockerfile.alpine
      - docker-entrypoint.sh
      - gildas_release.py
      - "gildas-*.def"
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.alpine
      - docker-entrypoint.sh
      - gildas_release.py
      - "gildas-*.def"

env:
  DOCKER_BUILDKIT: 1

jobs:
  plan:
    # Print what would be built, without building or pushing it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install click requests beautifulsoup4
      - run: ./gildas_release.py
      - run: ./gildas_release.py --debian

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: alpine
            script_args: ""
            cache_tags: "latest latest-piic"
          - family: debian
            script_args: "--debian"
            cache_tags: "latest-debian latest-piic-debian"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install click requests beautifulsoup4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Select script arguments
        id: sel
        run: |
          ARGS="${{ matrix.script_args }}"
          SKIP="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.debian }}" = "true" ] && [ "${{ matrix.family }}" != "debian" ]; then
              SKIP="true"
            fi
            if [ "${{ inputs.debian }}" != "true" ] && [ "${{ matrix.family }}" != "alpine" ]; then
              SKIP="true"
            fi
            [ -n "${{ inputs.release }}" ] && ARGS="$ARGS --release ${{ inputs.release }}"
            [ "${{ inputs.piic }}" = "true" ] && ARGS="$ARGS --piic"
            [ "${{ inputs.archive }}" = "true" ] && ARGS="$ARGS --archive"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Pre-pull previous tags for layer-cache reuse
        if: steps.sel.outputs.skip != 'true'
        run: |
          for tag in ${{ matrix.cache_tags }}; do
            docker pull abeelen/gildas:"$tag" || true
          done
      - name: Build and push missing images
        if: steps.sel.outputs.skip != 'true'
        run: ./gildas_release.py ${{ steps.sel.outputs.args }} --execute
