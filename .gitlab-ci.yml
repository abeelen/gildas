# CI for abeelen/gildas (Alpine by default, Debian on demand).
#
# The brains stay in gildas_release.py: CI selects the mode and runs what
# the script prints. Pushes need DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
# Runners tagged `docker` provide the Docker daemon (host socket, no dind
# service needed). Schedules are created in the GitLab UI (Build >
# Pipeline schedules, e.g. weekly); manual runs via "Run pipeline" with
# optional variables (RELEASE, DEBIAN=1, PIIC=1, ARCHIVE=1, SIF_TAGS).
# SIFs cannot be BUILT here (no user namespaces fleet-wide): the mirror
# job republishes the GitHub-built SIFs as job artifacts instead.

stages: [plan, build, publish]

variables:
  DOCKER_BUILDKIT: "1"

plan:
  stage: plan
  image: python:3.13-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install -q --break-system-packages click requests beautifulsoup4 pytest
  script:
    - python -m pytest tests/ -q
    - ./gildas_release.py
    - ./gildas_release.py --debian

build:
  stage: build
  image: docker:27
  tags: [docker]
  timeout: 3h
  parallel:
    matrix:
      - FAMILY: [alpine, debian]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # TEMPORARY: builds disabled while debugging (revert to plain
    # `- if: $CI_COMMIT_BRANCH == "master"` to restore).
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install -q --break-system-packages click requests beautifulsoup4
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker info >/dev/null # fail fast without Docker access
    - if [ "$DEBIAN" = "1" ] && [ "$FAMILY" != "debian" ]; then exit 0; fi
    - ARGS=""
    - if [ "$FAMILY" = "debian" ]; then ARGS="$ARGS --debian"; fi
    - if [ -n "$RELEASE" ]; then ARGS="$ARGS --release $RELEASE"; fi
    - if [ "$PIIC" = "1" ]; then ARGS="$ARGS --piic"; fi
    - if [ "$ARCHIVE" = "1" ]; then ARGS="$ARGS --archive"; fi
    - CACHE_TAGS="latest latest-piic"
    - if [ "$FAMILY" = "debian" ]; then CACHE_TAGS="latest-debian latest-piic-debian"; fi
    - for tag in $CACHE_TAGS; do docker pull -q abeelen/gildas:"$tag" || true; done
    # shellcheck disable=SC2086
    - ./gildas_release.py $ARGS --execute --log-dir logs
    - |
      if [ "$FAMILY" = "alpine" ] && docker image inspect abeelen/gildas:latest >/dev/null 2>&1; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag abeelen/gildas:latest "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  artifacts:
    paths: [logs/]
    expire_in: 1 week
    when: always

sif-mirror:
  # Fetch the GitHub-built SIFs and keep them as job artifacts, for users
  # who can reach gitlab.lam.fr but not github.com. Manual only.
  stage: publish
  image: alpine:3.21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apk add --no-cache curl
  script:
    - |
      mkdir -p sifs
      # shellcheck disable=SC2086
      for tag in ${SIF_TAGS:-latest latest-piic}; do
        sif="gildas-$tag.sif"
        if curl -fSL "https://github.com/abeelen/gildas/releases/download/sif-images/$sif" -o "sifs/$sif"; then
          echo "Mirrored $sif."
        else
          echo "WARNING: $sif not on the GitHub release, skipping."
        fi
      done
  artifacts:
    paths: [sifs/]
    expire_in: never
