# CI for abeelen/gildas (Alpine by default, Debian on demand).
#
# The brains stay in gildas_release.py: CI selects the mode and runs what
# the script prints. Pushes need DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
# Runners tagged `docker` provide the Docker daemon (host socket, no dind
# service needed). Schedules are created in the GitLab UI (Build >
# Pipeline schedules, e.g. weekly); manual runs via "Run pipeline" with
# optional variables (RELEASE, DEBIAN=1, PIIC=1, ARCHIVE=1, SIF_TAGS,
# SIF_TMPDIR, SIF_MIN_FREE_GB).
# Cache tags are pulled from the GitLab Container Registry first (when
# present) and only fall back to Docker Hub, which avoids Hub rate limits
# on repeat builds. The same tags are mirrored back after each build.
# SIFs are built natively on the dedicated `apptainer` runner from the
# GitLab registry (no Docker installed there) and pushed back to the
# project registry as `sif:<tag>` OCI artifacts. GitHub Actions keeps
# publishing its SIFs as `sif-images` release assets instead.

stages: [plan, build, publish]

variables:
  DOCKER_BUILDKIT: "1"

plan:
  stage: plan
  image: python:3.13-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install -q --break-system-packages click requests beautifulsoup4 pytest
  script:
    - python -m pytest tests/ -q
    - ./gildas_release.py
    - ./gildas_release.py --debian

build:
  stage: build
  image: docker:27
  tags: [docker]
  timeout: 3h
  parallel:
    matrix:
      - FAMILY: [alpine, debian]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install -q --break-system-packages click requests beautifulsoup4
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
  script:
    - docker info >/dev/null # fail fast without Docker access
    - if [ "$DEBIAN" = "1" ] && [ "$FAMILY" != "debian" ]; then exit 0; fi
    - ARGS=""
    - if [ "$FAMILY" = "debian" ]; then ARGS="$ARGS --debian"; fi
    - if [ -n "$RELEASE" ]; then ARGS="$ARGS --release $RELEASE"; fi
    - if [ "$PIIC" = "1" ]; then ARGS="$ARGS --piic"; fi
    - if [ "$ARCHIVE" = "1" ]; then ARGS="$ARGS --archive"; fi
    - CACHE_TAGS="latest-alpine latest-piic-alpine"
    - if [ "$FAMILY" = "debian" ]; then CACHE_TAGS="latest-debian latest-piic-debian"; fi
    - |
      # Prefer the GitLab mirror; fall back to Docker Hub on first run.
      for tag in $CACHE_TAGS; do
        if [ -n "${CI_REGISTRY_IMAGE:-}" ] && docker pull -q "$CI_REGISTRY_IMAGE:$tag" 2>/dev/null; then
          docker tag "$CI_REGISTRY_IMAGE:$tag" "abeelen/gildas:$tag"
          echo "Using GitLab registry cache for $tag"
        elif docker pull -q "abeelen/gildas:$tag" 2>/dev/null; then
          echo "Using Docker Hub cache for $tag"
        else
          echo "No cached image for $tag"
        fi
      done
    # shellcheck disable=SC2086
    - ./gildas_release.py $ARGS --execute --log-dir logs
    - |
      # Mirror the cache tags (and the unsuffixed aliases used by sif-build)
      # back to the GitLab registry for the next run.
      if [ -n "${CI_REGISTRY_IMAGE:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        if [ "$FAMILY" = "alpine" ]; then
          # The registry mirror is only a cache: refresh the floating aliases
          # from Docker Hub so a stale GitLab copy cannot be republished.
          for alias in latest latest-piic; do
            if docker pull -q "abeelen/gildas:$alias" 2>/dev/null; then
              docker tag "abeelen/gildas:$alias" "abeelen/gildas:${alias}-alpine"
            elif docker image inspect "abeelen/gildas:${alias}-alpine" >/dev/null 2>&1; then
              docker tag "abeelen/gildas:${alias}-alpine" "abeelen/gildas:$alias"
            fi
          done
        fi
        for tag in $CACHE_TAGS; do
          if docker image inspect "abeelen/gildas:$tag" >/dev/null 2>&1; then
            docker tag "abeelen/gildas:$tag" "$CI_REGISTRY_IMAGE:$tag"
            docker push -q "$CI_REGISTRY_IMAGE:$tag"
          fi
        done
        if [ "$FAMILY" = "alpine" ]; then
          for tag in latest latest-piic; do
            if docker image inspect "abeelen/gildas:$tag" >/dev/null 2>&1; then
              docker tag "abeelen/gildas:$tag" "$CI_REGISTRY_IMAGE:$tag"
              docker push -q "$CI_REGISTRY_IMAGE:$tag"
            fi
          done
        fi
      fi
  artifacts:
    paths: [logs/]
    expire_in: 1 week
    when: always

sif-build:
  # Build the SIFs directly on the `apptainer` runner, for users who can
  # reach gitlab.lam.fr. The runner has no Docker: apptainer pulls the
  # image from the GitLab Container Registry instead. Each SIF is then
  # pushed to `<registry>/<project>/sif:<tag>` with `singularity push`
  # (plain `oras push` stamps an artifact type this registry rejects).
  # The per-tag def file rewrites `From:` on defs/gildas-docker.def.
  # Manual only.
  stage: publish
  tags: [apptainer]
  timeout: 6h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Manual: also listed on master pipelines (not only web-triggered ones).
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - |
      set -euo pipefail

      # Apptainer/Singularity unpack OCI layers under TMPDIR. The runner's
      # default /tmp is small (and mounted nodev); the PIIC image does not
      # fit there. Keep build temp and cache on the build volume instead,
      # where the SIF artifacts live. Point SIF_TMPDIR/SIF_CACHEDIR at a
      # larger scratch filesystem if the build volume is not big enough.
      # (Leftover /tmp/build-temp-* from older runs can be removed once;
      # the EXIT trap below cleans the new location.)
      build_root="${SIF_TMPDIR:-${CI_PROJECT_DIR:-$PWD}/.apptainer-tmp}"
      cache_root="${SIF_CACHEDIR:-${CI_PROJECT_DIR:-$PWD}/.apptainer-cache}"
      build_tmp="${build_root}/job-${CI_JOB_ID:-$$}"
      build_cache="${cache_root}/job-${CI_JOB_ID:-$$}"
      export APPTAINER_TMPDIR="$build_tmp"
      export SINGULARITY_TMPDIR="$build_tmp"
      export APPTAINER_CACHEDIR="$build_cache"
      export SINGULARITY_CACHEDIR="$build_cache"
      export TMPDIR="$build_tmp"
      # The runner may reuse the workspace. SIFs are no longer archived,
      # but stale local copies still consume the build volume.
      rm -rf sifs
      mkdir -p "$build_tmp" "$build_cache" sifs

      tmp_def=""
      cleanup() {
        rm -rf "$build_tmp" "$build_cache" 2>/dev/null || true
        [ -z "$tmp_def" ] || rm -f "$tmp_def" 2>/dev/null || true
      }
      trap cleanup EXIT

      echo "Build temp:  $build_tmp"
      echo "Build cache: $build_cache"
      df -h "$build_tmp" sifs || true
      free_gb="$(df -Pk "$build_tmp" | awk 'NR==2 {print int($4 / 1024 / 1024)}')"
      free_gb="${free_gb:-0}"
      if [ -n "${SIF_MIN_FREE_GB:-}" ] && [ "$free_gb" -lt "$SIF_MIN_FREE_GB" ]; then
        echo "ERROR: only ${free_gb} GiB free in $build_tmp; need at least ${SIF_MIN_FREE_GB} GiB (set SIF_TMPDIR or SIF_MIN_FREE_GB)." >&2
        exit 1
      fi

      if command -v apptainer >/dev/null 2>&1; then
        builder=apptainer
      elif command -v singularity >/dev/null 2>&1; then
        builder=singularity
      else
        echo "ERROR: neither apptainer nor singularity is installed" >&2
        exit 1
      fi
      "$builder" --version

      : "${CI_REGISTRY:?CI_REGISTRY is not set}"
      : "${CI_REGISTRY_IMAGE:?CI_REGISTRY_IMAGE is not set}"
      : "${CI_REGISTRY_USER:?CI_REGISTRY_USER is not set}"
      : "${CI_REGISTRY_PASSWORD:?CI_REGISTRY_PASSWORD is not set}"

      # Docker-style authfile for the registry: singularity remote login
      # only handles Sylabs endpoints, not generic OCI registries.
      authfile="${build_tmp}/docker-config.json"
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > "$authfile"
      chmod 600 "$authfile"

      # Default is both rolling tags. The SIFs are pushed to the project
      # registry, not archived, so their ~253/~640 MiB size no longer
      # determines the pipeline artifact size.
      for tag in ${SIF_TAGS:-latest latest-piic}; do
        # Build the per-tag def from defs/gildas-docker.def. Write to a temp
        # file: when tag == latest, the source is not the destination, but
        # keeping the rewrite in the build temp avoids clobbering it.
        tmp_def="$(mktemp -p "$build_tmp" gildas-def.XXXXXX)"
        : "${CI_REGISTRY_IMAGE:?CI_REGISTRY_IMAGE is not set}"
        sed "s|^From: .*|From: ${CI_REGISTRY_IMAGE}:${tag}|" defs/gildas-docker.def > "${tmp_def}"
        echo "Building gildas-${tag} from ${CI_REGISTRY_IMAGE}:${tag} ..."
        # --disable-cache keeps the compressed OCI layers out of the build
        # volume: the uncompressed rootfs alone is already the peak user.
        # --force makes reruns overwrite a partial/previous SIF.
        sif="sifs/gildas-${tag}.sif"
        "$builder" build --fakeroot --disable-cache --force "$sif" "${tmp_def}"
        rm -f "${tmp_def}"
        tmp_def=""
        echo "Built $sif ($(du -h "$sif" | cut -f1)); pushing to oras://${CI_REGISTRY_IMAGE}/sif:${tag} ..."
        "$builder" push -U --authfile "$authfile" "$sif" "oras://${CI_REGISTRY_IMAGE}/sif:${tag}"
        rm -f "$sif"
      done

      echo "SIFs pushed; local copies removed."
