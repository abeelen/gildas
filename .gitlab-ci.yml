# Build and push abeelen/gildas images (Alpine by default, Debian on demand).
#
# Same design as the GitHub Actions workflow: the brains stay in
# gildas_release.py, CI only selects the mode and runs what the script
# prints. Needs two CI/CD variables for pushes (Settings > CI/CD):
#   DOCKERHUB_USERNAME : Docker Hub login (masked)
#   DOCKERHUB_TOKEN    : Hub access token, Read & Write (masked)
# Merge requests only get a printed plan (no login, no push, no build).
#
# Builds run on runners tagged `docker`, which provide the Docker
# daemon directly (host socket, no dind service needed). Schedules are
# created in the GitLab UI (Build > Pipeline schedules, e.g. weekly);
# manual runs via "Run pipeline" with optional variables:
#   RELEASE : single GILDAS release (e.g. oct26a, empty = all missing)
#   DEBIAN  : set to 1 to build Debian instead of Alpine (both otherwise)
#   PIIC    : set to 1 for PIIC images only
#   ARCHIVE : set to 1 to include archived releases

stages: [plan, build, publish]

variables:
  DOCKER_BUILDKIT: "1"

plan:
  stage: plan
  image: python:3.13-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install -q --break-system-packages click requests beautifulsoup4 pytest
  script:
    - python -m pytest tests/ -q
    - ./gildas_release.py
    - ./gildas_release.py --debian

build:
  stage: build
  image: docker:27
  tags: [docker]
  timeout: 3h
  parallel:
    matrix:
      - FAMILY: [alpine, debian]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install -q --break-system-packages click requests beautifulsoup4
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    # Fail fast when the runner has no Docker access.
    - docker info >/dev/null
    # Manual run with DEBIAN=1 restricts to the Debian leg (like --debian).
    - if [ "$DEBIAN" = "1" ] && [ "$FAMILY" != "debian" ]; then echo "Skipped (DEBIAN=1)."; exit 0; fi
    - ARGS=""
    - if [ "$FAMILY" = "debian" ]; then ARGS="$ARGS --debian"; fi
    - if [ -n "$RELEASE" ]; then ARGS="$ARGS --release $RELEASE"; fi
    - if [ "$PIIC" = "1" ]; then ARGS="$ARGS --piic"; fi
    - if [ "$ARCHIVE" = "1" ]; then ARGS="$ARGS --archive"; fi
    - CACHE_TAGS="latest latest-piic"
    - if [ "$FAMILY" = "debian" ]; then CACHE_TAGS="latest-debian latest-piic-debian"; fi
    - for tag in $CACHE_TAGS; do docker pull -q abeelen/gildas:"$tag" || true; done
    # shellcheck disable=SC2086
    - ./gildas_release.py $ARGS --execute --log-dir logs
    - |
      # Mirror alpine-latest to the GitLab container registry (Alpine leg
      # only, to start with). Short-lived CI_REGISTRY_* credentials, no
      # setup needed. Skipped when there is no local image to push.
      if [ "$FAMILY" = "alpine" ] && docker image inspect abeelen/gildas:latest >/dev/null 2>&1; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag abeelen/gildas:latest "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Skipping GitLab registry mirror (non-Alpine leg or no local latest image)."
      fi
  artifacts:
    paths: [logs/]
    expire_in: 1 week
    when: always

sif:
  # Convert Hub tags to SIFs and push them to the project container
  # registry ($CI_REGISTRY_IMAGE/sif:<tag>), pullable with
  # `singularity pull oras://<registry>/<project>/sif:<tag>`.
  # Pushed with `singularity push` (not oras: plain `oras push` stamps
  # artifactType vnd.unknown.artifact.v1, which this registry rejects),
  # authenticated with the same CI_REGISTRY_* job credentials as the
  # docker push. Native .def builds stay on GitHub, where runners have
  # root. Manual runs take SIF_TAGS (default: latest + latest-piic);
  # schedules always refresh (a weekly pull-convert-push costs minutes).
  stage: publish
  image: ubuntu:24.04
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq singularity-container squashfs-tools ca-certificates curl
    - singularity version
  script:
    - |
      TAGS="${SIF_TAGS:-latest latest-piic}"
      # Docker-style authfile for the registry (remote login only handles
      # Sylabs endpoints, not generic OCI registries).
      mkdir -p "$HOME/.docker"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" > "$HOME/.docker/config.json"
      for tag in $TAGS; do
        sif="gildas-$tag.sif"
        rm -f "$sif"
        if singularity build "$sif" "docker://abeelen/gildas:$tag"; then
          singularity push -U --authfile "$HOME/.docker/config.json" "$sif" oras://"$CI_REGISTRY_IMAGE/sif:$tag"
        else
          echo "WARNING: could not build $sif (tag $tag missing on Hub?), skipping."
        fi
        rm -f "$sif"
      done
