# Build and push abeelen/gildas images (Alpine by default, Debian on demand).
#
# Same design as the GitHub Actions workflow: the brains stay in
# gildas_release.py, CI only selects the mode and runs what the script
# prints. Needs two CI/CD variables for pushes (Settings > CI/CD):
#   DOCKERHUB_USERNAME : Docker Hub login (masked)
#   DOCKERHUB_TOKEN    : Hub access token, Read & Write (masked)
# Merge requests only get a printed plan (no login, no push, no build).
#
# Builds run on runners tagged `docker`, which provide the Docker
# daemon directly (host socket, no dind service needed). Schedules are
# created in the GitLab UI (Build > Pipeline schedules, e.g. weekly);
# manual runs via "Run pipeline" with optional variables:
#   RELEASE : single GILDAS release (e.g. oct26a, empty = all missing)
#   DEBIAN  : set to 1 to build Debian instead of Alpine (both otherwise)
#   PIIC    : set to 1 for PIIC images only
#   ARCHIVE : set to 1 to include archived releases

stages: [plan, build, publish]

variables:
  DOCKER_BUILDKIT: "1"

plan:
  stage: plan
  image: python:3.13-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install -q --break-system-packages click requests beautifulsoup4 pytest
  script:
    - python -m pytest tests/ -q
    - ./gildas_release.py
    - ./gildas_release.py --debian

build:
  stage: build
  image: docker:27
  tags: [docker]
  timeout: 3h
  parallel:
    matrix:
      - FAMILY: [alpine, debian]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install -q --break-system-packages click requests beautifulsoup4
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    # Fail fast when the runner has no Docker access.
    - docker info >/dev/null
    # Manual run with DEBIAN=1 restricts to the Debian leg (like --debian).
    - if [ "$DEBIAN" = "1" ] && [ "$FAMILY" != "debian" ]; then echo "Skipped (DEBIAN=1)."; exit 0; fi
    - ARGS=""
    - if [ "$FAMILY" = "debian" ]; then ARGS="$ARGS --debian"; fi
    - if [ -n "$RELEASE" ]; then ARGS="$ARGS --release $RELEASE"; fi
    - if [ "$PIIC" = "1" ]; then ARGS="$ARGS --piic"; fi
    - if [ "$ARCHIVE" = "1" ]; then ARGS="$ARGS --archive"; fi
    - CACHE_TAGS="latest latest-piic"
    - if [ "$FAMILY" = "debian" ]; then CACHE_TAGS="latest-debian latest-piic-debian"; fi
    - for tag in $CACHE_TAGS; do docker pull abeelen/gildas:"$tag" || true; done
    # shellcheck disable=SC2086
    - ./gildas_release.py $ARGS --execute

sif:
  # Convert Hub tags to SIFs into the generic package registry
  # (gildas-sif / <tag> / gildas-<tag>.sif). Needs no Docker and no extra
  # variables (CI_JOB_TOKEN authenticates); native .def builds stay on
  # GitHub, where runners have root. Manual runs take SIF_TAGS
  # (default: latest + latest-piic); schedules rebuild only tags pushed
  # after the published package (fail-open).
  stage: publish
  image: ubuntu:24.04
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq singularity-container squashfs-tools python3 ca-certificates
    - singularity version
  script:
    - |
      TAGS="${SIF_TAGS:-latest latest-piic}"
      for tag in $TAGS; do
        sif="gildas-$tag.sif"
        if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
          pushed=$(curl -s "https://hub.docker.com/v2/repositories/abeelen/gildas/tags/$tag" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_last_pushed',''))" 2>/dev/null || true)
          created=$(TAG="$tag" curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=gildas-sif" | TAG="$tag" python3 -c "import json,os,sys; print(next((p['created_at'] for p in json.load(sys.stdin) if p.get('version') == os.environ['TAG']), ''))" 2>/dev/null || true)
          if [ -n "$pushed" ] && [ -n "$created" ] && [ "$created" \> "$pushed" ]; then
            echo "$tag unchanged since $created, skipping."
            continue
          fi
        fi
        rm -f "$sif"
        if singularity build "$sif" "docker://abeelen/gildas:$tag"; then
          curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" --request DELETE "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gildas-sif/$tag/$sif" >/dev/null || true
          curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$sif" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gildas-sif/$tag/$sif"
        else
          echo "WARNING: could not build $sif (tag $tag missing on Hub?), skipping."
        fi
        rm -f "$sif"
      done
